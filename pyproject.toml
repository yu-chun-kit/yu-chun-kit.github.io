[project]
name = "chatblog"
version = "0.1.0"
description = "OpenWebUI conversation backup publisher for a Hexo blog."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "playwright>=1.49.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "rich>=13.7.1",
  "typer>=0.12.3",
]

[project.scripts]
chatblog = "chatblog.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatblog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
